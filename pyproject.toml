[project]
name = "harness-studio"
version = "0.2.0a1"
description = "Harness Studio — a governed, adversarial AI software-delivery framework (hssd CLI)."
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.0",
    "pillow>=12.2.0",
    "python-pptx>=1.0.2",
]

[project.scripts]
hssd = "cli.hssd:main"
harness-sd = "cli.hssd:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cli"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.17",
]

# NOTE: the data dirs (agents/, skills/, templates/, scaffolds/, workflows/) resolve from the repo
# in an EDITABLE install (the CLI finds them relative to its own file). Bundling them into a wheel
# as package data (importlib.resources) is the productization step.
