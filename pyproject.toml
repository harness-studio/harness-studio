[project]
name = "harness-studio"
version = "0.2.0a1"
description = "Harness Studio — a governed, adversarial AI software-delivery framework (hssd CLI)."
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.0",
    "pillow>=12.2.0",
    "python-pptx>=1.0.2",
]

[project.scripts]
hssd = "cli.hssd:main"
harness-sd = "cli.hssd:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["cli"]

[tool.setuptools.package-data]
cli = [
    "agents/**/*",
    "skills/**/*",
    "templates/**/*",
    "commands/**/*",
    "VERSION",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.17",
]
