[project]
name = "service"               # CLI templatizes this per engagement
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "sqlalchemy>=2",
    "aiosqlite",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "httpx", "ruff"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# UP -> pyupgrade: forbids legacy typing (Optional[X] -> X | None)
# C90 -> mccabe: the complexity ceiling (function points)
# S   -> flake8-bandit: security-first (e.g., flags injection-prone patterns)
# ASYNC -> async-correctness; B -> bugbear
select = ["E", "F", "I", "UP", "B", "C90", "ASYNC", "S"]

[tool.ruff.lint.mccabe]
max-complexity = 8             # exceed it -> atomize/refactor (a defect, even if tests pass)

[tool.pytest.ini_options]
asyncio_mode = "auto"
